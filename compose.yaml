services:
  db:
    image: postgres:16
    container_name: company_app_db
    environment:
      POSTGRES_DB: CompanyAppDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d CompanyAppDb"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./CompanyApplicationApi
      dockerfile: Dockerfile
    container_name: company_app_api
    ports:
      - "5109:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=CompanyAppDb;Username=postgres;Password=mysecretpassword
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: